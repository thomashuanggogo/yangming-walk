<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>陽明里與陽明山・散步圖鑑</title>
<style>
:root{color-scheme:light;--ink:#253f35;--paper:#f7f5ec;--green:#2f6852}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,"Microsoft JhengHei",sans-serif}header{padding:52px max(24px,calc((100vw - 1180px)/2));background:#244d3f;color:#fff9e8}header small{letter-spacing:.18em;color:#d1ddbd}h1{font-size:clamp(28px,4vw,46px);line-height:1.25;margin:14px 0}header p{max-width:760px;margin-bottom:8px;color:#dbe6d3}main{max-width:1230px;margin:auto;padding:24px}nav{position:sticky;top:0;z-index:2;background:#f7f5ecf5;backdrop-filter:blur(10px);padding:14px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center}input[type=search]{flex:1;min-width:200px}input,select,button{font:inherit;padding:10px 14px;border:1px solid #acbca9;border-radius:9px;background:white;color:var(--ink)}input[type=checkbox]{accent-color:var(--green)}label{font-size:14px}#count{font-size:14px;color:#5a6e5e;margin:4px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:22px}.card{border:1px solid #d6dfcc;border-radius:16px;overflow:hidden;background:#fffdf7;box-shadow:0 4px 14px #233e3510}.card img{width:100%;aspect-ratio:360/260;object-fit:contain;display:block;background:#e8eddf}.body{padding:20px}.eyebrow{font-size:12px;color:#5d7660}.code{display:inline-block;background:#e2eacf;border-radius:6px;padding:1px 7px;margin-right:7px;font-weight:700}h2{font-size:18px;line-height:1.5;margin:8px 0 10px}p{margin:8px 0;font-size:14px}details{font-size:14px}summary{cursor:pointer;color:var(--green);padding:5px 0}a{color:#286853}.saved{color:#217254;font-weight:700;font-size:12px}.empty{padding:45px;text-align:center}footer{max-width:1180px;margin:35px auto;padding:25px;border-top:1px solid #cfdbc6;color:#61745e;font-size:12px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #d69c3c;outline-offset:2px}@media print{nav,button{display:none}.grid{grid-template-columns:repeat(2,1fr)}.card{break-inside:avoid}header{background:white;color:#253f35;padding:20px}header p{color:inherit}details>p{display:block}}
</style></head><body><header><small>YANGMING WALKING ATLAS · 離線珍藏版</small><h1>陽明里與陽明山<br>把山城風景帶回家</h1><p>從山仔后的街角，到前山公園的湖畔，再走向中山樓與花鐘。每一張圖片都由遊戲裡的建築模型匯出。</p><p>這份圖鑑已內含圖片與介紹，下載後不需網路即可搜尋、閱讀。</p></header><main><nav aria-label="圖鑑篩選"><input id="search" type="search" aria-label="搜尋地標" placeholder="搜尋名稱、編號或景點特色"><select id="region" aria-label="選擇區域"><option value="all">全部區域</option></select><label><input id="visited" type="checkbox"> 只看已收錄</label><button id="reset">清除篩選</button></nav><p id="count" aria-live="polite"></p><div class="grid" id="cards"></div></main><footer><p>模型為風格化縮景，建築比例、庭園與部分細節依遊戲需求調整，非實地測繪或開放資訊。既有景點介紹沿用遊戲內容；已查證的新景點附有參考來源。外部來源連結需網路。</p><p>道路與湖岸資料：© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>，ODbL 1.0。匯出版本：2026-09-27。</p></footer><script>
const DATA = /* ATLAS_DATA */ [];
const visitedIds = /* VISITED_SNAPSHOT */ [];
const visitedSet=new Set(visitedIds),region=document.querySelector('#region'),search=document.querySelector('#search'),onlyVisited=document.querySelector('#visited');
const names=new Map();for(const p of DATA)if(!names.has(p.district))names.set(p.district,p.districtName);for(const [key,label] of names){const option=document.createElement('option');option.value=key;option.textContent=label;region.appendChild(option);}
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const q=search.value.trim().toLocaleLowerCase();const list=DATA.filter(p=>(region.value==='all'||p.district===region.value)&&(!onlyVisited.checked||visitedSet.has(p.id))&&[p.code,p.name,p.description].join(' ').toLocaleLowerCase().includes(q));document.querySelector('#count').textContent=`顯示 ${list.length} / ${DATA.length} 個地標・此份圖鑑匯出時已收錄 ${visitedSet.size} 處`;document.querySelector('#cards').innerHTML=list.length?list.map(p=>`<article class="card"><img src="${p.image}" alt="${escape(p.name)}的遊戲模型" loading="lazy"><div class="body"><div class="eyebrow"><span class="code">${p.code}</span>${escape(p.category)} ${visitedSet.has(p.id)?'<span class="saved">✓ 已收錄</span>':''}</div><h2>${escape(p.name)}</h2><p class="eyebrow">${escape(p.districtName)}</p><details><summary>閱讀景點介紹</summary><p>${escape(p.description)}</p>${p.sourceUrl?`<p><a href="${escape(p.sourceUrl)}" target="_blank" rel="noopener">參考來源 ↗</a></p>`:''}</details></div></article>`).join(''):'<p class="empty">沒有符合的地標，試試其他名稱或清除篩選。</p>';}
search.addEventListener('input',render);region.addEventListener('change',render);onlyVisited.addEventListener('change',render);document.querySelector('#reset').onclick=()=>{search.value='';region.value='all';onlyVisited.checked=false;render();};render();
</script></body></html>
